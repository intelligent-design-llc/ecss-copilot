name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ecss-copilot:ci .
      - name: Smoke test
        run: |
          docker run -d --name ec -p 8000:8000 ecss-copilot:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/config && break; sleep 1; done
          curl -sf -F "text=SYS-010 The OBC shall be fast." http://127.0.0.1:8000/api/analyze | grep -q '"findings"'
          docker rm -f ec
